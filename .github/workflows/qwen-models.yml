# Dang mo hinh Qwen3-ASR-1.7B phan xu chep loi len Release rieng (ten tag trong qwen-models.json) moi khi danh muc doi
# tren main. Dung chung tools/publish_asr_models.sh voi bo ASR. Khong dung Release "latest" vi workflow kia xoa va tao lai no.
name: Dang mo hinh Qwen3-ASR phan xu
on:
  push:
    branches: [main]
    paths: ['video-studio/assets/qwen-models.json', '.github/workflows/qwen-models.yml']
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tai tu HuggingFace, kiem sha256, cat parts, dang release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish_asr_models.sh dist/qwen-models video-studio/assets/qwen-models.json
