# Dang mo hinh nhan dang giong noi bo sung (Whisper large-v3, FireRedASR2 int8 ONNX) len Release rieng (ten tag trong asr-models.json)
# moi khi danh muc doi tren main. Khong dung Release "latest" vi workflow kia xoa va tao lai no.
name: Dang mo hinh ASR bo sung
on:
  push:
    branches: [main]
    paths: ['video-studio/assets/asr-models.json', 'tools/publish_asr_models.sh', '.github/workflows/asr-models.yml']
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tai tu HuggingFace, kiem sha256, cat parts, dang release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish_asr_models.sh
