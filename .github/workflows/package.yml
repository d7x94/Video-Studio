# Pull request: kiem tra script, lineart.js/chibi.js khop nguon, thu dong goi (khong dang gi).
# Push len main: kiem tra nhu tren, roi dong goi zip va dang len Release "latest"
# de tai ve va upload vao claude.ai.
name: Dong goi skill
on:
  pull_request:
    paths: ['video-studio/**', 'tools/**', '.github/workflows/package.yml']
  push:
    branches: [main]
    paths: ['video-studio/**', 'tools/**', '.github/workflows/package.yml']
  workflow_dispatch:
concurrency:
  group: package-skill-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiem tra cu phap script
        run: |
          for f in video-studio/scripts/*.sh tools/*.sh; do bash -n "$f"; done
          python3 -m py_compile video-studio/scripts/*.py
      - name: Thu dong goi va kiem noi dung zip
        run: |
          bash tools/package_skill.sh dist/video-studio.zip
          unzip -Z1 dist/video-studio.zip | grep -v '^video-studio/' && { echo "Zip co file ngoai thu muc skill"; exit 1; } || true
      - uses: actions/upload-artifact@v4
        with:
          name: video-studio-zip
          path: dist/video-studio.zip
          retention-days: 7
  venet-chu:
    # Kiem venet-chu.js khop phong Patrick Hand. Tach job rieng, khong chan phat hanh: ket qua phu thuoc phien ban Pillow, numpy, scipy, fonttools (chua ghim).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiem venet-chu.js khop nguon
        run: |
          # venv: tools/build_venet_chu.sh chay python3 -I (bo qua thu muc goi cua nguoi dung), nen goi phai nam trong venv
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pillow numpy scipy fonttools
          PATH="$RUNNER_TEMP/venv/bin:$PATH" bash tools/build_venet_chu.sh --check
  release:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: video-studio-zip
          path: dist
      - name: Dang Release latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Nhieu PR merge sat nhau thi cac lan chay co the toi tre, sai thu tu.
          # Chi dang khi commit nay van la dau main, de ban cu khong ghi de ban moi.
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "Bo qua: ${GITHUB_SHA::7} khong con la dau main (${head::7}); lan chay cua commit moi hon se dang."
            exit 0
          fi
          VER=$(tr -d '[:space:]' < video-studio/VERSION)
          gh release delete latest -y --cleanup-tag || true
          gh release create latest dist/video-studio.zip \
            --target "$GITHUB_SHA" \
            --title "video-studio v$VER (ban moi nhat)" \
            --notes "Phien ban $VER. Tu dong dong goi tu commit ${GITHUB_SHA::7}. Tai video-studio.zip, vao claude.ai > Settings > Skills de tai len thay ban cu."
