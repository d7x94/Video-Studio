<!doctype html>
<html lang="vi" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Tat ca tai nguyen phai nam cuc bo: CDN va Google Fonts bi chan trong workspace -->
    <link rel="stylesheet" href="fonts/400.css" />
    <link rel="stylesheet" href="fonts/600.css" />
    <link rel="stylesheet" href="fonts/800.css" />
    <script src="gsap.min.js"></script>
    <style>
      /* Bang mau: agent dung canh thay theo ho so the loai */
      :root {
        --bg: #0e2a3b;
        --bg-2: #154360;
        --ink: #ffffff;
        --muted: #c9dde9;
        --accent: #ffb703;
        --danger: #e85d4a;
        --font: "Be Vietnam Pro", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); color: var(--ink); }
      .clip { position: absolute; inset: 0; }

      /* Chua le rong o duoi va ben phai: giao dien TikTok/Shorts (chu thich, nut bam) che vung do.
         Kiem tra lai bang ban xem thu tren dien thoai truoc khi dang. */
      .scene { display: flex; flex-direction: column; justify-content: center; gap: 48px;
               padding: 220px 140px 520px 90px; }
      .eyebrow { font-weight: 600; font-size: 40px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
      .title { font-weight: 800; font-size: 96px; line-height: 1.12; }
      .body { font-weight: 400; font-size: 52px; line-height: 1.35; color: var(--muted); }
      .source { position: absolute; left: 90px; bottom: 560px; font-size: 30px; color: var(--muted); opacity: 0.8; }

      /* Phu de dot chu: inject.py sinh cac phan tu .cap */
      .cap { display: flex; align-items: flex-end; justify-content: center; padding: 0 90px 330px 90px;
             z-index: 50; pointer-events: none; }
      .cap span { font-weight: 600; font-size: 50px; line-height: 1.3; text-align: center; max-width: 820px; text-wrap: balance;
                  background: rgba(0, 0, 0, 0.62); padding: 10px 26px; border-radius: 14px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <!-- SCENES:BEGIN -->
      <!-- Agent dung canh viet cac canh o day. Moi canh:
           <section id="sc-s01" class="clip scene" data-start="<visual_start>" data-duration="<visual_duration>">...</section>
           lay visual_start va visual_duration tu timeline.json -->
      <!-- SCENES:END -->

      <!-- AUDIO:BEGIN -->
      <!-- AUDIO:END -->

      <!-- CAPTIONS:BEGIN -->
      <!-- CAPTIONS:END -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // TIMES:BEGIN
      const T = {};
      // TIMES:END
      // ANIMATION:BEGIN
      // Agent dung canh them tween o day. Moc thoi gian viet theo diem bat dau cua canh,
      // T.<id> do inject.py dien tu timeline.json, vd:
      // tl.from("#sc-s01 .title", { y: 60, opacity: 0, duration: 0.6, ease: "power3.out" }, T.s01 + 0.2);
      // ANIMATION:END
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
