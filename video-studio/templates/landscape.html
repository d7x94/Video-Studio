<!doctype html>
<html lang="vi" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Tat ca tai nguyen phai nam cuc bo: CDN va Google Fonts bi chan trong workspace -->
    <link rel="stylesheet" href="fonts/400.css" />
    <link rel="stylesheet" href="fonts/600.css" />
    <link rel="stylesheet" href="fonts/800.css" />
    <script src="gsap.min.js"></script>
    <style>
      /* Bang mau: agent dung canh thay theo ho so the loai */
      :root {
        --bg: #0e2a3b;
        --bg-2: #154360;
        --ink: #ffffff;
        --muted: #c9dde9;
        --accent: #ffb703;
        --danger: #e85d4a;
        --font: "Be Vietnam Pro", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); color: var(--ink); }
      .clip { position: absolute; inset: 0; }

      .scene { display: flex; flex-direction: column; justify-content: center; gap: 36px;
               padding: 110px 180px 200px 180px; }
      .eyebrow { font-weight: 600; font-size: 34px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
      .title { font-weight: 800; font-size: 88px; line-height: 1.1; max-width: 1400px; }
      .body { font-weight: 400; font-size: 44px; line-height: 1.4; color: var(--muted); max-width: 1300px; }
      .source { position: absolute; right: 60px; bottom: 40px; font-size: 24px; color: var(--muted); opacity: 0.8; }

      /* Phu de dot chu (mac dinh tat cho YouTube vi da co file .srt) */
      .cap { display: flex; align-items: flex-end; justify-content: center; padding: 0 200px 70px 200px;
             z-index: 50; pointer-events: none; }
      .cap span { font-weight: 600; font-size: 40px; line-height: 1.3; text-align: center; text-wrap: balance;
                  background: rgba(0, 0, 0, 0.62); padding: 8px 22px; border-radius: 12px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <!-- SCENES:BEGIN -->
      <!-- Agent dung canh viet cac canh o day. Moi canh:
           <section id="sc-s01" class="clip scene" data-start="<visual_start>" data-duration="<visual_duration>">...</section>
           lay visual_start va visual_duration tu timeline.json -->
      <!-- SCENES:END -->

      <!-- AUDIO:BEGIN -->
      <!-- AUDIO:END -->

      <!-- CAPTIONS:BEGIN -->
      <!-- CAPTIONS:END -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // TIMES:BEGIN
      const T = {};
      // TIMES:END
      // ANIMATION:BEGIN
      // Agent dung canh them tween o day. Moc thoi gian viet theo diem bat dau cua canh,
      // T.<id> do inject.py dien tu timeline.json, vd:
      // tl.from("#sc-s01 .title", { y: 60, opacity: 0, duration: 0.6, ease: "power3.out" }, T.s01 + 0.2);
      // ANIMATION:END
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
